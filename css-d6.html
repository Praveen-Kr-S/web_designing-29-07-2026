<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap');
        .box{
            width: 150px;
            height: 150px;
            background-color: bisque;
            animation-name: b;
            animation-duration: 1s;
            animation-iteration-count: infinite;
        }
        @keyframes b{
            from{
                background-color: chocolate;
            }
            to{
                background-color: dodgerblue;
            }
        }

        h1{
            font-family: "Black Ops One", system-ui;
            font-weight: 400;
            font-style: normal;
            color: chocolate;
            animation-name: name;
            animation-duration: 2s;
            animation-iteration-count: 1;
            position: relative;
            left: 300px;
        }

        @keyframes name {
            0%{
                color: chocolate;
                left: 0px;
            }
            25%{
                color: darkcyan;
                
            }
            50%{
                color: gold;
            }
            75%{
                color: aqua;
            }
            100%{
                color: rgb(179, 60, 173);
                left: 300px;
            }
        }

        .cr{
            width: 200px;
            height: 200px;
            background-color: #e07a5f;
            border-radius: 50%;
            animation-name: move;
            animation-duration: 4s;
            animation-iteration-count: infinite;
            position: relative;
            left: 800px;
            top: 100px;
            transition: transform 2s;
        }

        @keyframes move {
            0%{
                top: 0px;
                left: 0px;
                transform: scale(1);
            }
            25%{
                top: 0;
                left: 400px;
                transform: scale(1);
            }
            50%{
                left: 400px;
                top: 100px;
                transform: scale(1);
            }
            75%{
                left: 800px;
                top: 100px;
                transform: scale(1);
            }
            100%{
                 transform: scale(1.5);
            }
        }



    </style>
</head>
<body>
    <!-- box Animation -->
    <div class="box">

    </div>

    <h1>Praveen Kumar</h1>

    <div class="cr"></div>

</body>
</html>
