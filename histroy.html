<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="b()" type="submit">Back</button>
    <button onclick="f()" type="submit">Forword</button>
    <button onclick="g()" type="submit">GO</button>

    <a href="https://www.youtube.com/">youtube</a>


    <script>
        function b(){
            window.history.back()
        }
        
        function f(){
            window.history.forward()
        }
        function g(){
            window.history.go(3)
        }

    </script>
</body>
</html>
