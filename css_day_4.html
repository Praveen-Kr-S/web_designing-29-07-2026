<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            height: 100vh;
            background-color: bisque;
        }

        .box{
            width: 150px;
            height: 150px;
            background-color: rgb(58, 55, 51);
        }

        .s{
            background-color: aqua;
            position: static;
            left: 200px;
        }

        .r{
            background-color: rgb(21, 255, 0);
            position: relative;
            left:0px;
            top: 0px;
        }


        .a{
            background-color: rgb(247, 0, 255);
            position: absolute;
            left: 100px;
            top: 200px;
        }

        .f{
            background-color: rgb(255, 230, 0);
            position: fixed;
            left: 380px;
            top: 50px;
        }


        .ss{
            background-color: rgb(38, 0, 255);
            position: sticky;
            left: 50px;
            top: 0px;
            
        }

        
    </style>
</head>
<body>
    <div>
        <div class="box s"></div>
    </div>
    <div>
        <div class="box r"></div>
    </div>
    <div>
        <div class="box a"></div>
    </div>
    <div>
        <div class="box f"></div>
    </div>
    <div style="height: 200vh;">
        <div class="box ss"></div>
    </div>
    <div >
        <div class="box">

        </div>

        &#xae;
        <h1>&#x2103;</h1>

        <h2>&#9743;</h2>
        <h1>&#x2192;</h1>
    </div>
    
</body>
</html>
